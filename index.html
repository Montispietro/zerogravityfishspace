<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zero Gravity Fish Space Ltd — Aquatic Life Support for Space & Earth</title>
<meta name="description" content="Patented aquatic life-support technology reducing water dependency by 90%. Dual-use innovation for space biomedical research and sustainable aquaculture.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #050810;
    --deep: #080d1a;
    --navy: #0a1628;
    --blue: #0d3b6e;
    --cyan: #00b4d8;
    --cyan-dim: #0077a8;
    --gold: #c9a84c;
    --gold-light: #e8c96a;
    --white: #f0f4ff;
    --grey: #8a9ab5;
    --font-display: 'Bebas Neue', sans-serif;
    --font-body: 'Crimson Pro', serif;
    --font-mono: 'Space Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: var(--font-body);
    font-size: 18px;
    line-height: 1.7;
    overflow-x: hidden;
  }

  /* STARS BACKGROUND */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.8) 0%, transparent 100%),
      radial-gradient(1px 1px at 25% 60%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 40% 30%, rgba(255,255,255,0.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 80%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 20%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 50%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 75%, rgba(255,255,255,0.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 15% 85%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 45%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 35% 10%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 85% 35%, rgba(255,255,255,0.8) 0%, transparent 100%),
      radial-gradient(1px 1px at 5% 45%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 75% 90%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 45% 65%, rgba(0,180,216,0.6) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 20% 40%, rgba(0,180,216,0.4) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  /* NAV */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    padding: 1.2rem 3rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(5, 8, 16, 0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(0, 180, 216, 0.1);
  }

  .nav-logo {
    font-family: var(--font-display);
    font-size: 1.1rem;
    letter-spacing: 0.15em;
    color: var(--cyan);
  }

  .nav-links {
    display: flex;
    gap: 2.5rem;
    list-style: none;
  }

  .nav-links a {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--grey);
    text-decoration: none;
    transition: color 0.3s;
  }

  .nav-links a:hover { color: var(--cyan); }

  /* HERO */
  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 8rem 3rem 5rem;
    z-index: 1;
  }

  .hero::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 300px;
    background: radial-gradient(ellipse at 50% 100%, rgba(0,180,216,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero-eyebrow {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--cyan);
    margin-bottom: 1.5rem;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.2s forwards;
  }

  .hero-title {
    font-family: var(--font-display);
    font-size: clamp(4rem, 10vw, 9rem);
    line-height: 0.9;
    letter-spacing: 0.02em;
    color: var(--white);
    margin-bottom: 0.3rem;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.4s forwards;
  }

  .hero-title span {
    color: var(--cyan);
    display: block;
  }

  .hero-subtitle {
    font-family: var(--font-display);
    font-size: clamp(1.8rem, 4vw, 3.5rem);
    letter-spacing: 0.08em;
    color: var(--gold);
    margin-bottom: 2.5rem;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.6s forwards;
  }

  .hero-desc {
    max-width: 600px;
    font-size: 1.15rem;
    font-weight: 300;
    color: rgba(240, 244, 255, 0.75);
    line-height: 1.8;
    margin-bottom: 3rem;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.8s forwards;
  }

  .hero-badges {
    display: flex;
    gap: 1.5rem;
    flex-wrap: wrap;
    opacity: 0;
    animation: fadeUp 0.8s ease 1s forwards;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.5rem 1.2rem;
    border: 1px solid rgba(0, 180, 216, 0.3);
    background: rgba(0, 180, 216, 0.06);
    font-family: var(--font-mono);
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--cyan);
  }

  .badge.gold {
    border-color: rgba(201, 168, 76, 0.4);
    background: rgba(201, 168, 76, 0.06);
    color: var(--gold-light);
  }

  .badge::before {
    content: '●';
    font-size: 0.5rem;
  }

  /* DIVIDER */
  .divider {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0,180,216,0.3), transparent);
    margin: 0;
  }

  /* SECTIONS */
  section {
    position: relative;
    z-index: 1;
    padding: 6rem 3rem;
    max-width: 1100px;
    margin: 0 auto;
  }

  .section-label {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--cyan);
    margin-bottom: 1rem;
  }

  .section-title {
    font-family: var(--font-display);
    font-size: clamp(2.5rem, 5vw, 4.5rem);
    letter-spacing: 0.04em;
    line-height: 1;
    color: var(--white);
    margin-bottom: 2.5rem;
  }

  /* ... (tutti gli altri stili rimangono invariati) ... */

  .hero-image-section {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: center;
    padding: 2rem 3rem 0;
  }

  .hero-media-container {
    display: flex;
    gap: 2rem;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    max-width: 1100px;
  }

  .hero-media-container img,
  .hero-media-container video {
    max-width: 420px;
    width: 100%;
    border: 1px solid rgba(0,180,216,0.25);
    border-radius: 12px;
    box-shadow: 0 0 60px rgba(0,180,216,0.15);
    background: rgba(5,8,16,0.6);
  }

  .hero-media-container video {
    object-fit: cover;
  }

  @media (max-width: 768px) {
    nav { padding: 1rem 1.5rem; }
    .nav-links { display: none; }
    .hero { padding: 7rem 1.5rem 4rem; }
    section { padding: 4rem 1.5rem; }
    .stats { grid-template-columns: 1fr; }
    .stat { border-right: none; border-bottom: 1px solid rgba(0,180,216,0.15); }
    .tech-grid { grid-template-columns: 1fr; }
    .market-grid { grid-template-columns: 1fr; }
    .traction-items { grid-template-columns: 1fr; }
    .contact-section { padding: 4rem 1.5rem; }
    footer { flex-direction: column; gap: 1rem; text-align: center; }
    .hero-media-container {
      flex-direction: column;
      gap: 1.5rem;
    }
  }
</style>
</head>
